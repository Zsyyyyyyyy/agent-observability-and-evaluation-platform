[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "regression-lab"
version = "1.3.3"
description = "Framework-neutral Agent regression evaluation and observability platform"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
keywords = ["ai-agent", "evaluation", "observability", "regression-testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
regression-lab = "scripts.regression_lab:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regression_lab", "src/regression_lab_observer", "scripts", "adapters"]

# 安装用户不应再依赖 Git 仓库；这些资源随 wheel 发布，但不会变成 Python 顶级包。
[tool.hatch.build.targets.wheel.force-include]
"web" = "regression_lab/assets/web"
"benchmarks" = "regression_lab/assets/benchmarks"
"fixtures" = "regression_lab/assets/fixtures"
"configs" = "regression_lab/assets/configs"
"demo" = "regression_lab/assets/demo"
"adapters" = "regression_lab/assets/adapters"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/scripts",
  "/adapters",
  "/web",
  "/benchmarks",
  "/fixtures",
  "/configs",
  "/demo",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]
