[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regression-lab"
version = "0.2.0"
description = "Framework-neutral Agent regression evaluation and observability platform"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
keywords = ["ai-agent", "evaluation", "observability", "regression-testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
regression-lab = "scripts.regression_lab:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["regression_lab*", "scripts", "adapters*"]
