name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Docker availability
        run: docker info
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run complete offline verification
        run: make verify
      - name: Run Docker sandbox integration tests
        run: make docker-test
      - name: Run expected-failure probes in Docker
        run: make failure-suite
