name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Docker availability
        run: docker info
      - name: Run deterministic test suite
        run: make test
      - name: Run Docker sandbox integration tests
        run: make docker-test
      - name: Run expected-failure probes in Docker
        run: make failure-suite
      - name: Validate all benchmark manifests
        run: make manifest-check
