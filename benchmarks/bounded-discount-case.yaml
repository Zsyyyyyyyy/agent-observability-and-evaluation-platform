schema_version: 1
status: ready
id: bounded_discount_percent
version: 1
title: 限制折扣百分比上界
fixture: {path: fixtures/bounded_discount, language: python, test_command: python -m unittest discover -s tests -v}
task:
  prompt: 请修复 apply_discount：折扣超过 100% 时，最终价格应为 0，正常折扣计算保持不变。只能修改 src/。
  allowed_paths: [src/**]
  forbidden_paths: [tests/**]
execution: {timeout_seconds: 180, max_tokens: 12000, max_tool_calls: 12, max_retries: 1, trials: 1, network: none}
tool_policy:
  allow: [read_file, write_file, edit_file, glob, bash]
  deny: [spawn_teammate, connect_mcp, schedule_cron, create_worktree, remove_worktree, keep_worktree]
evaluators:
  required: [test, path_policy, diff, tool_integrity, budget, trace_completeness]
acceptance:
  must: [test_exit_code == 0, forbidden_path_changes == 0, result_status == completed]
