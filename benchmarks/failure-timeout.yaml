schema_version: 1
id: failure_timeout
version: 1
title: 注入 Trial 超时
fixture:
  path: fixtures/smoke_calculator
  test_command: "python -m unittest discover -s tests -v"
task:
  prompt: "controlled timeout probe"
  allowed_paths: ["src/**"]
  forbidden_paths: ["tests/**"]
execution:
  timeout_seconds: 1
  max_tokens: 1
  max_tool_calls: 1
  trials: 1
  network: none
tool_policy:
  allow: ["edit_file"]
  deny: ["connect_mcp"]
failure_mode: timeout
evaluators:
  required: ["budget"]
acceptance:
  must: ["timeout blocks"]
