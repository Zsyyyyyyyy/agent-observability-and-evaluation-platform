schema_version: 1
status: ready
id: permission_deny_precedence
version: 1
title: 修复工具权限的拒绝优先级
fixture: {path: fixtures/permission_precedence, language: python, test_command: python -m unittest discover -s tests -v}
task:
  prompt: 请修复 is_allowed：policy 使用 glob 匹配工具名；存在匹配 deny 时必须拒绝，即使 allow 包含通配符，未匹配 allow 的工具也必须拒绝。请理解 src/matcher.py 与 src/policy.py，只能修改 src/。
  allowed_paths: [src/**]
  forbidden_paths: [tests/**]
execution: {timeout_seconds: 180, max_tokens: 16000, max_tool_calls: 16, max_retries: 1, trials: 1, network: none}
tool_policy:
  allow: [read_file, write_file, edit_file, glob, bash]
  deny: [spawn_teammate, connect_mcp, schedule_cron, create_worktree, remove_worktree, keep_worktree]
evaluators:
  required: [test, path_policy, diff, tool_integrity, budget, trace_completeness]
acceptance:
  must: [test_exit_code == 0, forbidden_path_changes == 0, result_status == completed]
